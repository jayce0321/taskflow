<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — 프로젝트 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 사이드바 -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="logo">⚡ TaskFlow</span>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-item active" data-view="all">
      <span class="nav-icon">🏠</span> 전체 보기
    </button>
    <button class="nav-item" data-view="today">
      <span class="nav-icon">📅</span> 오늘 마감
    </button>
    <button class="nav-item" data-view="overdue">
      <span class="nav-icon">🔥</span> 기한 초과
    </button>
  </nav>

  <div class="sidebar-section">
    <div class="section-header">
      <span>프로젝트</span>
      <button id="addProjectBtn" title="프로젝트 추가">+</button>
    </div>
    <ul id="projectList"></ul>
  </div>

  <!-- 동기화 상태 + 데이터 백업 -->
  <div class="sidebar-footer">
    <div id="syncStatus" class="sync-status">☁️ 클라우드 저장됨</div>
    <div class="backup-btns">
      <a href="/api/export" class="btn-backup" title="JSON으로 내보내기">📥 내보내기</a>
      <label class="btn-backup" title="JSON 파일로 가져오기">
        📤 가져오기
        <input type="file" id="importFile" accept=".json" hidden />
      </label>
    </div>
  </div>
</aside>

<!-- 메인 -->
<main class="main">

  <!-- 상단 헤더 -->
  <header class="main-header">
    <div>
      <h1 id="viewTitle">전체 보기</h1>
      <p id="viewSubtitle" class="subtitle"></p>
    </div>
    <button id="openTaskModal" class="btn-primary">+ 할 일 추가</button>
  </header>

  <!-- 통계 카드 -->
  <section class="stats" id="statsSection">
    <div class="stat-card">
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-label">전체</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="statDone">0</span>
      <span class="stat-label">완료</span>
    </div>
    <div class="stat-card warn">
      <span class="stat-num" id="statOverdue">0</span>
      <span class="stat-label">기한 초과</span>
    </div>
    <div class="stat-card info">
      <span class="stat-num" id="statToday">0</span>
      <span class="stat-label">오늘 마감</span>
    </div>
  </section>

  <!-- 뷰 모드 + 필터 & 정렬 -->
  <div class="toolbar">
    <!-- 리스트 전용 필터 (캘린더에서는 숨김) -->
    <div class="filter-group" id="listFilterGroup">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="todo">진행 전</button>
      <button class="filter-btn" data-filter="doing">진행 중</button>
      <button class="filter-btn" data-filter="done">완료</button>
    </div>
    <!-- 캘린더 전용 월 이동 (리스트에서는 숨김) -->
    <div class="cal-inline-nav hidden" id="calInlineNav">
      <button class="cal-nav" id="calPrev2">‹</button>
      <span id="calTitle2" class="cal-inline-title"></span>
      <button class="cal-nav" id="calNext2">›</button>
      <button class="btn-today" id="calTodayBtn">오늘</button>
    </div>
    <div class="toolbar-right">
      <div class="view-toggle">
        <button class="view-btn active" data-view-mode="list">☰ 리스트</button>
        <button class="view-btn" data-view-mode="calendar">📅 캘린더</button>
      </div>
      <select id="sortSelect">
        <option value="created">등록순</option>
        <option value="deadline">마감일순</option>
        <option value="priority">우선순위순</option>
      </select>
    </div>
  </div>

  <!-- 리스트 뷰 -->
  <section id="taskBoard"></section>

  <!-- 캘린더 뷰 -->
  <section id="calendarView" class="hidden">
    <div class="cal-month-grid">
      <div class="cal-weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="cal-legend" id="calLegend"></div>
  </section>

</main>

<!-- 할 일 추가/수정 모달 -->
<div id="taskModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">할 일 추가</h2>
      <button class="modal-close" id="closeTaskModal">✕</button>
    </div>

    <div class="form-group">
      <label>할 일 제목 *</label>
      <input type="text" id="taskTitle" placeholder="무엇을 해야 하나요?" />
    </div>

    <div class="form-group">
      <label>설명</label>
      <textarea id="taskDesc" placeholder="상세 내용을 입력하세요..." rows="3"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>프로젝트</label>
        <select id="taskProject"></select>
      </div>
      <div class="form-group">
        <label>상태</label>
        <select id="taskStatus">
          <option value="todo">진행 전</option>
          <option value="doing">진행 중</option>
          <option value="done">완료</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>우선순위</label>
        <select id="taskPriority">
          <option value="low">낮음</option>
          <option value="medium" selected>보통</option>
          <option value="high">높음</option>
        </select>
      </div>
      <div class="form-group">
        <label>시작 일시</label>
        <input type="datetime-local" id="taskStartDate" />
      </div>
    </div>

    <div class="form-group">
      <label>마감 일시</label>
      <input type="datetime-local" id="taskDeadline" />
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" id="cancelTaskBtn">취소</button>
      <button class="btn-primary" id="saveTaskBtn">저장</button>
    </div>
  </div>
</div>

<!-- 프로젝트 추가 모달 -->
<div id="projectModal" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-header">
      <h2>프로젝트 추가</h2>
      <button class="modal-close" id="closeProjectModal">✕</button>
    </div>
    <div class="form-group">
      <label>프로젝트 이름 *</label>
      <input type="text" id="projectName" placeholder="프로젝트 이름" />
    </div>
    <div class="form-group">
      <label>색상</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="cancelProjectBtn">취소</button>
      <button class="btn-primary" id="saveProjectBtn">저장</button>
    </div>
  </div>
</div>

<!-- 배경 오버레이 -->
<div id="overlay" class="overlay hidden"></div>

<script src="app.js"></script>
</body>
</html>
